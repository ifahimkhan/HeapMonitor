name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and assemble
        run: >
          ./gradlew
          :heapmonitor:testDebugUnitTest
          :heapmonitor:assembleRelease
          :heapmonitor-noop:assembleRelease
          :app:assembleDebug
          --console=plain

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: heapmonitor/build/reports/tests/
